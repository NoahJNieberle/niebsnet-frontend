<div>
  <nav>
    <div>
      <div>
        <a
          routerLink="/"
          class="logo"
          (click)="trackLogoClick()"
        >
          <img src="niebsnet-logo.svg" alt="" aria-hidden="true" />
          <span>NiebsNet</span>
        </a>
        <ul class="desktop-nav">
          @for (item of navItems; track item.sectionId) {
            <li>
              <a 
                [href]="'#' + item.sectionId" 
                (click)="scrollToSection(item.sectionId, $event)"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
        <button
          type="button"
          aria-controls="mobile-navigation"
          [attr.aria-expanded]="isMobileNavOpen"
          aria-label="Toggle navigation menu"
          (click)="toggleMobileNav()"
        >
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      <ul
        id="mobile-navigation"
        class="mobile-nav"
        [class.open]="isMobileNavOpen"
      >
        @for (item of navItems; track item.sectionId) {
          <li>
            <a 
              [href]="'#' + item.sectionId" 
              (click)="scrollToSection(item.sectionId, $event)"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>

  <main>
    <router-outlet />
  </main>

  <footer>
    <div>
      <p>
        Built by Noah Nieberle
      </p>
    </div>
  </footer>
</div>
